<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomSync L3A · Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f3f5f8; color: #1d2733; height: 100vh; display: flex; flex-direction: column; font-size: 16px; }
  header { background: #fff; border-bottom: 1px solid #dde3ea; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 19px; }
  header p { font-size: 13px; color: #5b6875; }
  #model { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #e6eef6; }
  #model.fake { background: #ffe66d; font-weight: 700; }
  main { flex: 1; overflow-y: auto; padding: 18px; }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 12px 16px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
  .user { align-self: flex-end; max-width: 80%; background: #33597d; color: #fff; }
  .bot { background: #fff; border: 1px solid #dde3ea; border-left: 5px solid #33597d; }
  .bot.refuse { border-left-color: #a5391f; background: #fdf6f4; }
  .bot.ask { border-left-color: #c28a00; background: #fffaeb; }
  .bot.error { border-left-color: #a5391f; color: #a5391f; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 10px; background: #e6eef6; margin-bottom: 8px; white-space: normal; }
  .refuse .tag { background: #f5d8d1; }
  .ask .tag { background: #ffe9a8; }
  .meta { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e6eaf0; font-size: 12.5px; color: #5b6875; display: flex; justify-content: space-between; gap: 10px; align-items: center; white-space: normal; }
  button { font: inherit; cursor: pointer; border: 1px solid #c5ced8; background: #fff; border-radius: 8px; color: inherit; }
  button:disabled { opacity: .5; cursor: default; }
  .copy { font-size: 12.5px; padding: 3px 10px; }
  footer { background: #fff; border-top: 1px solid #dde3ea; padding: 10px 18px 14px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .examples button { font-size: 13px; padding: 5px 12px; }
  form { display: flex; gap: 10px; }
  textarea { flex: 1; font: inherit; padding: 10px 12px; border: 1px solid #c5ced8; border-radius: 8px; resize: none; }
  #send { background: #33597d; color: #fff; border-color: #33597d; padding: 0 24px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div>
    <h1>RoomSync L3A · Đối chiếu phòng và soạn thông báo</h1>
    <p>Dữ liệu lịch giả lập, xuất 21:00 27/04/2027 · Chỉ tạo bản nháp chờ key coach duyệt, không tự gửi</p>
  </div>
  <span id="model">đang kiểm tra model…</span>
</header>
<main>
  <div class="wrap" id="chat">
    <div class="msg bot">Chào bạn. Hãy nhập yêu cầu kèm lớp và ngày hoặc mã buổi, hoặc bấm một câu mẫu bên dưới.</div>
  </div>
</main>
<footer>
  <div class="wrap">
    <div class="examples" id="examples"></div>
    <form id="form">
      <textarea id="input" rows="2" placeholder="Ví dụ: Soạn thông báo phòng cho L3A LAB 9 sáng 27/04. (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
      <button id="send" type="submit">Gửi</button>
    </form>
  </div>
</footer>
<script>
const EXAMPLES = [
  ["Ca thường", "Soạn thông báo phòng cho L3A LAB 9 sáng 27/04."],
  ["Chưa xác nhận phòng", "Bảng lab coach ghi L3A LAB 11 ngày 03/05 dự kiến C201, C203, C204, C304, E305, F307, soạn thông báo báo học viên mấy phòng này nhé."],
  ["Đổi phòng", "Soạn thông báo phòng cho L3A LAB 5 sáng 22/04."],
  ["Thiếu thông tin", "Tối nay mình cần soạn thông báo phòng lab cho buổi ngày mai, soạn giúp mình ngay nhé!"],
  ["Vượt thẩm quyền", "Phòng 03/05 của L3A chờ lâu quá, bạn tự chốt luôn phòng H209, H210 cho L3A LAB 11 rồi gửi email cho cả lớp đi."]
];
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const examples = document.getElementById("examples");
let busy = false;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function add(node) {
  chat.appendChild(node);
  node.scrollIntoView({ block: "start", behavior: "smooth" });
  return node;
}

function setBusy(value) {
  busy = value;
  send.disabled = value;
  examples.querySelectorAll("button").forEach(b => b.disabled = value);
}

function render(box, data) {
  box.textContent = "";
  if (data.error) {
    box.className = "msg bot error";
    box.textContent = "Lỗi: " + data.error;
    return;
  }
  const out = data.output;
  let kind = "", label = "Bản nháp do AI soạn, chờ duyệt";
  if (out.startsWith("=== HỆ THỐNG TỪ CHỐI")) { kind = "refuse"; label = "Từ chối bằng code (G1)"; }
  else if (out.startsWith("=== CẦN THÊM THÔNG TIN")) { kind = "ask"; label = "Hỏi lại bằng code"; }
  box.className = "msg bot " + kind;
  box.appendChild(el("span", "tag", label));
  box.appendChild(el("div", "", out));
  const meta = el("div", "meta");
  meta.appendChild(el("span", "", "model: " + (data.models.join(", ") || "không gọi") + " · gọi model " + data.model_calls +
    " lần · công cụ " + data.tool_calls + " lần · token vào " + data.tokens_in + " / ra " + data.tokens_out + " · " + data.seconds + " giây"));
  const copy = el("button", "copy", "Sao chép");
  copy.type = "button";
  copy.onclick = () => navigator.clipboard.writeText(out).then(() => copy.textContent = "Đã chép");
  meta.appendChild(copy);
  box.appendChild(meta);
  box.scrollIntoView({ block: "start", behavior: "smooth" });
}

async function ask(text) {
  text = text.trim();
  if (!text || busy) return;
  setBusy(true);
  input.value = "";
  add(el("div", "msg user", text));
  const box = add(el("div", "msg bot", "Đang xử lý…"));
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
    render(box, await res.json());
  } catch (e) {
    render(box, { error: "Không kết nối được server. Kiểm tra cửa sổ đang chạy python codebase/web.py." });
  }
  setBusy(false);
  input.focus();
}

EXAMPLES.forEach(([label, text]) => {
  const b = el("button", "", label);
  b.type = "button";
  b.title = text;
  b.onclick = () => ask(text);
  examples.appendChild(b);
});
document.getElementById("form").onsubmit = e => { e.preventDefault(); ask(input.value); };
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(input.value); }
});
fetch("/api/info").then(r => r.json()).then(info => {
  const badge = document.getElementById("model");
  if (info.provider === "fake") { badge.className = "fake"; badge.textContent = "CHẾ ĐỘ GIẢ: chưa nối model"; }
  else badge.textContent = "Model: " + info.model;
});
</script>
</body>
</html>
