# Mô phỏng chi phí khi dùng thật — guide bước 4.2.
# Người dùng của bản chạy thử là NGƯỜI SOẠN THÔNG BÁO (key coach / Day Lead / lab coach), không phải 700 học viên.
# Chạy: python run.py simulate --try (10 phiên) · python run.py simulate (bản nộp CP4)

sessions: 50
seed: 42

users:              # số người soạn thông báo phòng nếu đưa vào dùng
  low: 6
  base: 10
  high: 15
  source: "Cơ sở 10 = số key coach khác nhau trong bảng lab coach Khoá 9 (data giả lập BTC, đếm từ data/schedule_data.json) — chỉ để hình dung quy mô; thấp 6, cao 15 (thêm lab coach / ban đào tạo dùng): (tự ước tính). Chưa có số thật của khoá."

personas:
  - name: key_coach_it
    share: 0.4
    uses_per_month: 2
    turns_per_session: 1
    source: "Khảo sát O1 (n = 3 người vận hành): 2/3 đối chiếu / gửi thông báo cho 1–4 buổi trong 4 tuần, 1/3 là 0 buổi → điểm giữa ~2 phiên / tháng. n quá nhỏ — share là (tự ước tính)."
  - name: key_coach_vua
    share: 0.4
    uses_per_month: 6
    turns_per_session: 2
    source: "Data giả lập: mỗi key coach phụ trách 4–9 buổi trong ~3,5 tuần (đếm data/schedule_data.json) → ~6 phiên / tháng; 2 lượt / phiên (soạn + hỏi lại / sửa): (tự ước tính)."
  - name: day_lead_nhieu
    share: 0.2
    uses_per_month: 20
    turns_per_session: 3
    source: "(tự ước tính) Day Lead / ban đào tạo rà nhiều lớp mỗi tối trước buổi học (track A: 'key coach soạn thông báo mỗi tối trước buổi lab')."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).

prices:             # USD / 1 triệu token — further-reading/model-prices.md của repo đề (BTC tra ngày 25/11/2026)
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (bảng giá BTC) · tầng Nhỏ — model đang dùng"
  - model: gemini-4-hydrogen
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 25/11/2026 (bảng giá BTC) · tầng Lớn"

